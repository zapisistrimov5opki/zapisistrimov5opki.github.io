<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Записи Стримов Пятёрки / Генератор Таймкодов</title>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: {
              50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d',

      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-slate-950 pb-16">

  <!-- Main Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

    <!-- Top Navigation / Header -->
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-6 mb-8 border-b border-slate-800/80 gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/20 font-black text-lg">
          ⏱️
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-100 flex items-center gap-2">
            Записи Стримов Пятёрки / Генератор Таймкодов
          </h1>
          <p class="text-xs text-slate-400">Автоматическое форматирование ссылок для YouTube, Twitch, Kick, VK Video, VK Live</p>
        </div>
      </div>

      <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
        <button id="clearBtn" class="inline-flex items-center space-x-1.5 px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-red-950/40 border border-slate-800 hover:border-red-800/50 text-slate-400 hover:text-red-300 transition-all cursor-pointer">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          <span>Очистить всё</span>
        </button>
      </div>
    </header>

    <!-- App Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

      <!-- Left Column: Form Controls -->
      <div class="lg:col-span-7 space-y-6">

        <!-- Main Stream & Moments Card -->
        <div class="bg-slate-900/80 backdrop-blur-sm border border-slate-800 rounded-2xl p-5 shadow-xl space-y-5">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <h2 class="text-sm font-semibold text-slate-200 flex items-center space-x-2">
              <i data-lucide="video" class="w-4 h-4 text-amber-400"></i>
              <span>Основной стрим</span>
            </h2>
            <button onclick="addMainMoment()" class="inline-flex items-center space-x-1 px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-semibold transition-all cursor-pointer">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Добавить момент</span>
            </button>
          </div>

          <!-- Main Stream Meta Inputs -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-950/40 p-3.5 rounded-xl border border-slate-800/60">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Дата записи</label>
              <input type="text" id="streamDate" placeholder="10 июл. 2026" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Заголовок блока</label>
              <input type="text" id="mainTitle" value="Основной" placeholder="Основной" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500">
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-medium text-slate-400">Ссылка</label>
                <div id="platformBadge"></div>
              </div>
              <input type="text" id="videoId" placeholder="https://youtu.be/..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500">
            </div>
          </div>

          <!-- Main Moments List -->
          <div id="mainMomentsList" class="space-y-3"></div>

          <!-- Hashtags Input -->
          <div class="pt-3 border-t border-slate-800/80">
            <label class="block text-xs font-medium text-slate-400 mb-1">Хэштеги (в конце описания)</label>
            <input type="text" id="hashtags" placeholder="#FreakLand #стрим #моменты" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <!-- Additional Streams Section -->
        <div class="bg-slate-900/80 backdrop-blur-sm border border-slate-800 rounded-2xl p-5 shadow-xl space-y-5">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <div>
              <h2 class="text-sm font-semibold text-slate-200 flex items-center space-x-2">
                <i data-lucide="layers" class="w-4 h-4 text-purple-400"></i>
                <span>Дополнительные стримы</span>
              </h2>
              <p class="text-[11px] text-slate-500 mt-0.5">Дневные, ночные, игровые потоки и переподрубы</p>
            </div>
            <button onclick="addExtraStream()" class="inline-flex items-center space-x-1 px-3 py-1.5 bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-xl text-xs font-semibold transition-all cursor-pointer">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Добавить стрим</span>
            </button>
          </div>

          <div id="extraStreamsList" class="space-y-6"></div>
        </div>

      </div>

      <!-- Right Column: Text Output & Live Preview -->
      <div class="lg:col-span-5 space-y-6 lg:sticky lg:top-6 lg:h-fit">

        <div class="bg-slate-900/80 backdrop-blur-sm border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
          <!-- Header tabs -->
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center space-x-2">
              <button id="tabTextBtn" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer bg-amber-500/10 text-amber-400 border border-amber-500/30">
                Текст описания
              </button>
              <button id="tabEmbedBtn" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                Предпросмотр плеера
              </button>
            </div>

            <button id="copyBtn" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 transition-all shadow-md shadow-amber-500/10 cursor-pointer">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i>
              <span id="copyBtnText">Скопировать</span>
            </button>
          </div>

          <!-- Text View Tab -->
          <div id="tabTextContent" class="space-y-3">
            <textarea id="outputArea" readonly rows="18" placeholder="Здесь будет сгенерированный текст таймкодов..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs font-mono text-slate-200 focus:outline-none resize-none leading-relaxed select-all placeholder-slate-700"></textarea>

            <div class="flex items-center justify-between text-xs text-slate-500 px-1">
              <span>Символов: <strong id="charCount" class="text-slate-300">0</strong></span>
              <a id="externalOpenLink" href="#" target="_blank" rel="noreferrer" class="hidden inline-flex items-center space-x-1 text-amber-400/80 hover:text-amber-300 transition-colors">
                <span id="externalOpenLabel">Открыть</span>
                <i data-lucide="external-link" class="w-3 h-3"></i>
              </a>
            </div>
          </div>

          <!-- Embed View Tab -->
          <div id="tabEmbedContent" class="hidden space-y-4">
            <div id="playerContainer"></div>
            <div id="jumpMomentsContainer" class="space-y-2"></div>
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 pointer-events-none"></div>

  <!-- Vanilla JS Logic -->
  <script>
    // --- Initial Clean State ---
    let state = {
      streamDate: '',
      mainTitle: 'Основной',
      videoId: '',
      hashtags: '',
      mainMoments: [],
      extraStreams: [],
      activeSeekTime: null
    };

    // --- Utilities ---

    function detectPlatform(input) {
      if (!input) return 'unknown';
      const trimmed = input.trim().toLowerCase();
      if (trimmed.includes('twitch.tv') || trimmed.includes('clips.twitch.tv')) return 'twitch';
      if (trimmed.includes('kick.com')) return 'kick';
      if (trimmed.includes('live.vkvideo.ru') || trimmed.includes('vk.com/live')) return 'vk_live';
      if (trimmed.includes('vkvideo.ru') || trimmed.includes('vk.com/video')) return 'vk';
      if (trimmed.includes('youtube.com') || trimmed.includes('youtu.be')) return 'youtube';
      if (/^[a-zA-Z0-9_-]{11}$/.test(input.trim())) return 'youtube';
      return 'unknown';
    }

    function timeToSeconds(timeStr) {
      if (!timeStr) return 0;
      const clean = timeStr.trim().toLowerCase().replace(/[()]/g, '');

      if (/^\d+$/.test(clean)) return parseInt(clean, 10);

      if (/^(\d+h)?(\d+m)?(\d+s)?$/.test(clean) && clean.length > 0) {
        const hMatch = clean.match(/(\d+)h/);
        const mMatch = clean.match(/(\d+)m/);
        const sMatch = clean.match(/(\d+)s/);
        const h = hMatch ? parseInt(hMatch[1], 10) : 0;
        const m = mMatch ? parseInt(mMatch[1], 10) : 0;
        const s = sMatch ? parseInt(sMatch[1], 10) : 0;
        return h * 3600 + m * 60 + s;
      }

      const parts = clean.split(':').map(p => parseInt(p, 10));
      if (!parts.some(isNaN)) {
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 1) return parts[0];
      }
      return 0;
    }

    function parseTimeToParam(timeStr, platform) {
      if (!timeStr) return '';
      const clean = timeStr.trim().toLowerCase().replace(/[()]/g, '');
      if (!clean || clean === '0:00' || clean === '0' || clean === '00:00') return '';

      const totalSecs = timeToSeconds(clean);
      if (totalSecs === 0) return '';

      // Kick & VK Live require raw seconds
      if (platform === 'kick' || platform === 'vk_live') {
        return String(totalSecs);
      }

      // YouTube, Twitch, VK Video use h/m/s
      const hours = Math.floor(totalSecs / 3600);
      const minutes = Math.floor((totalSecs % 3600) / 60);
      const seconds = totalSecs % 60;

      let res = '';
      if (hours > 0) res += `${hours}h`;
      if (minutes > 0 || hours > 0) res += `${minutes}m`;
      if (seconds > 0) res += `${seconds}s`;
      return res || '';
    }

    function extractVideoId(input) {
      if (!input) return '';
      const trimmed = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
      const match = trimmed.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : '';
    }

    function appendTimestampToUrl(baseUrl, timeStr) {
      if (!baseUrl) return '';
      const platform = detectPlatform(baseUrl);
      const param = parseTimeToParam(timeStr, platform);
      if (!param) return baseUrl;

      if (platform === 'vk_live') {
        const cleanUrl = baseUrl.replace(/([?&])(tc|t|time|at)=[^&]*/g, '$1').replace(/[?&]$/, '').replace(/\?&/, '?');
        const joiner = cleanUrl.includes('?') ? '&' : '?';
        return `${cleanUrl}${joiner}tc=${param}`;
      }

      const cleanUrl = baseUrl.replace(/([?&])(tc|t|time|at)=[^&]*/g, '$1').replace(/[?&]$/, '').replace(/\?&/, '?');
      const joiner = cleanUrl.includes('?') ? '&' : '?';
      return `${cleanUrl}${joiner}t=${param}`;
    }

    function buildTimestampLink(rawUrlOrId, timeStr, customUrlOverride) {
      if (customUrlOverride && customUrlOverride.trim()) {
        return appendTimestampToUrl(customUrlOverride.trim(), timeStr);
      }
      if (!rawUrlOrId || !rawUrlOrId.trim()) return '';

      const input = rawUrlOrId.trim();
      const platform = detectPlatform(input);

      if (platform === 'youtube') {
        const cleanId = extractVideoId(input);
        if (cleanId) {
          const baseHost = `https://youtu.be/${cleanId}`;
          const param = parseTimeToParam(timeStr, 'youtube');
          return param ? `${baseHost}?t=${param}` : baseHost;
        }
      }

      if (input.startsWith('http://') || input.startsWith('https://')) {
        return appendTimestampToUrl(input, timeStr);
      }

      const param = parseTimeToParam(timeStr, platform);
      return param ? `${input}?t=${param}` : input;
    }

    // --- Text Output Generator ---

    function generateFormattedText() {
      let lines = [];

      // Date Header
      if (state.streamDate.trim()) {
        lines.push(`Запись за ${state.streamDate.trim()}`);
        lines.push('');
      }

      const hasMain = state.mainMoments.length > 0;
      const hasExtra = state.extraStreams.some(s => s.moments.length > 0);

      if (hasMain || hasExtra) {
        lines.push('Интересные моменты стрима:');
      }

      // Main Section
      if (hasMain) {
        const mTitle = state.mainTitle.trim() || 'Основной';
        lines.push(`${mTitle}:`);

        state.mainMoments.forEach((item, idx) => {
          const num = idx + 1;
          const timeTag = item.time.trim() ? ` (${item.time.trim()})` : '';
          lines.push(`${num}) ${item.title.trim()}${timeTag}`);
          const link = buildTimestampLink(state.videoId, item.time, item.videoUrlOverride);
          if (link) lines.push(link);

          if (item.subMoments && item.subMoments.length > 0) {
            item.subMoments.forEach(sub => {
              const subTimeTag = sub.time.trim() ? ` (${sub.time.trim()})` : '';
              lines.push(`- ${sub.title.trim()}${subTimeTag}`);
              const subLink = buildTimestampLink(state.videoId, sub.time, sub.videoUrlOverride);
              if (subLink) lines.push(subLink);
            });
          }
          lines.push('');
        });
      }

      // Additional Streams
      if (hasExtra) {
        state.extraStreams.forEach((stream) => {
          if (stream.moments.length > 0) {
            const sTitle = stream.title.trim() || 'Дополнительный';
            lines.push(`${sTitle}:`);
            const sUrl = stream.streamUrl.trim() || state.videoId.trim();

            stream.moments.forEach((item, idx) => {
              const num = idx + 1;
              const timeTag = item.time.trim() ? ` (${item.time.trim()})` : '';
              lines.push(`${num}) ${item.title.trim()}${timeTag}`);

              const link = buildTimestampLink(sUrl, item.time, item.videoUrlOverride);
              if (link) lines.push(link);

              if (item.subMoments && item.subMoments.length > 0) {
                item.subMoments.forEach(sub => {
                  const subTimeTag = sub.time.trim() ? ` (${sub.time.trim()})` : '';
                  lines.push(`- ${sub.title.trim()}${subTimeTag}`);
                  const subLink = buildTimestampLink(sUrl, sub.time, sub.videoUrlOverride);
                  if (subLink) lines.push(subLink);
                });
              }
              lines.push('');
            });
          }
        });
      }

      // Hashtags
      if (state.hashtags.trim()) {
        if (lines.length > 0 && lines[lines.length - 1] !== '') {
          lines.push('');
        }
        lines.push(state.hashtags.trim());
      }

      // Remove trailing blank lines
      while (lines.length > 0 && lines[lines.length - 1] === '') {
        lines.pop();
      }

      return lines.join('\n');
    }

    // --- UI Render & Helpers ---

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast-animate bg-amber-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold shadow-xl flex items-center space-x-2 border border-amber-300';
      toast.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>${msg}</span>`;
      const container = document.getElementById('toastContainer');
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.remove(), 2600);
    }

    function updateBadge() {
      const badgeContainer = document.getElementById('platformBadge');
      if (!badgeContainer) return;
      const inputVal = state.videoId.trim();
      if (!inputVal) {
        badgeContainer.innerHTML = '';
        return;
      }

      const platform = detectPlatform(inputVal);

      if (platform === 'youtube') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-red-500/10 text-red-400 border border-red-500/20 px-2 py-0.5 rounded-md">YouTube</span>`;
      } else if (platform === 'twitch') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-purple-500/10 text-purple-400 border border-purple-500/20 px-2 py-0.5 rounded-md">Twitch</span>`;
      } else if (platform === 'kick') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md">Kick</span>`;
      } else if (platform === 'vk_live') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-md">VK Live</span>`;
      } else if (platform === 'vk') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 px-2 py-0.5 rounded-md">VK Video</span>`;
      } else {
        badgeContainer.innerHTML = '';
      }
    }

    function updateOutput() {
      const text = generateFormattedText();
      document.getElementById('outputArea').value = text;
      document.getElementById('charCount').innerText = text.length;

      const link = document.getElementById('externalOpenLink');
      const label = document.getElementById('externalOpenLabel');
      if (state.videoId.trim()) {
        const platform = detectPlatform(state.videoId);
        const platformLabel = platform === 'youtube' ? 'YouTube' : platform === 'twitch' ? 'Twitch' : platform === 'kick' ? 'Kick' : platform === 'vk_live' ? 'VK Live' : platform === 'vk' ? 'VK Видео' : 'Платформе';
        label.innerText = `Открыть на ${platformLabel}`;
        link.href = buildTimestampLink(state.videoId, '');
        link.classList.remove('hidden');
      } else {
        link.classList.add('hidden');
      }

      updatePlayerTab();
    }

    function updatePlayerTab() {
      const container = document.getElementById('playerContainer');
      const jumpContainer = document.getElementById('jumpMomentsContainer');
      const platform = detectPlatform(state.videoId);
      const cleanId = extractVideoId(state.videoId);

      if (platform === 'youtube' && cleanId) {
        container.innerHTML = `
          <div class="aspect-video w-full rounded-xl overflow-hidden border border-slate-800 bg-black">
            <iframe
              src="https://www.youtube.com/embed/${cleanId}?autoplay=0${state.activeSeekTime !== null ? '&start=' + state.activeSeekTime : ''}"
              title="YouTube player"
              class="w-full h-full"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        `;
      } else if (state.videoId.trim()) {
        const targetUrl = buildTimestampLink(state.videoId, state.activeSeekTime !== null ? state.activeSeekTime + 's' : '');
        container.innerHTML = `
          <div class="aspect-video w-full rounded-xl border border-slate-800 bg-slate-950 p-6 flex flex-col items-center justify-center text-center space-y-3">
            <p class="text-xs text-slate-400">Прямой переход для ссылки: <span class="font-mono text-amber-400">${escapeHtml(state.videoId)}</span></p>
            <a href="${targetUrl}" target="_blank" class="inline-flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 transition-colors">
              <span>Открыть видео (${platform.toUpperCase()})</span>
              <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
            </a>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="aspect-video w-full rounded-xl border border-slate-800 bg-slate-950 flex items-center justify-center text-xs text-slate-600">
            Укажите ссылку или ID видео для предпросмотра
          </div>
        `;
      }

      if (state.mainMoments.length > 0) {
        let jumpHtml = `<p class="text-xs font-semibold text-slate-400">Переход к моментам:</p><div class="flex flex-wrap gap-1.5">`;
        state.mainMoments.forEach((m) => {
          if (m.time) {
            const secs = timeToSeconds(m.time);
            jumpHtml += `
              <button onclick="seekToTime(${secs})" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-[11px] font-mono text-amber-400 hover:text-amber-300 transition-colors cursor-pointer">
                ${escapeHtml(m.time)}
              </button>
            `;
          }
        });
        jumpHtml += `</div>`;
        jumpContainer.innerHTML = jumpHtml;
      } else {
        jumpContainer.innerHTML = '';
      }

      lucide.createIcons();
    }

    function seekToTime(secs) {
      state.activeSeekTime = secs;
      updatePlayerTab();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // --- Main Moments Renders & Logic ---

    function renderMainMoments() {
      const container = document.getElementById('mainMomentsList');
      if (state.mainMoments.length === 0) {
        container.innerHTML = `
          <div class="text-center py-6 border border-dashed border-slate-800 rounded-xl bg-slate-950/20">
            <p class="text-xs text-slate-500 mb-2">Основной список моментов пуст</p>
            <button onclick="addMainMoment()" class="inline-flex items-center space-x-1 px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-semibold transition-all cursor-pointer">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Добавить первый момент</span>
            </button>
          </div>
        `;
        lucide.createIcons();
        updateOutput();
        return;
      }

      let html = '';
      state.mainMoments.forEach((item, idx) => {
        const linkPreview = buildTimestampLink(state.videoId, item.time, item.videoUrlOverride);

        let subHtml = '';
        if (item.subMoments && item.subMoments.length > 0) {
          subHtml = `<div class="mt-2 pl-4 space-y-2 border-l-2 border-slate-800">`;
          item.subMoments.forEach((sub, subIdx) => {
            subHtml += `
              <div class="flex items-center space-x-2">
                <span class="text-[11px] text-slate-500 font-mono">-</span>
                <input type="text" value="${escapeHtml(sub.title)}" oninput="updateSubMoment('${item.id}', '${sub.id}', 'title', this.value)" placeholder="Название подпункта" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500">
                <input type="text" value="${escapeHtml(sub.time)}" oninput="updateSubMoment('${item.id}', '${sub.id}', 'time', this.value)" placeholder="6:37" class="w-20 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs font-mono text-amber-400 placeholder-slate-600 focus:outline-none focus:border-amber-500">
                <button onclick="deleteSubMoment('${item.id}', '${sub.id}')" class="p-1 hover:bg-red-950/50 text-slate-500 hover:text-red-400 rounded-lg transition-colors cursor-pointer" title="Удалить подпункт">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `;
          });
          subHtml += `</div>`;
        }

        html += `
          <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3.5 space-y-2">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-bold text-slate-500 font-mono w-5">${idx + 1})</span>
              <input type="text" value="${escapeHtml(item.title)}" oninput="updateMainMoment('${item.id}', 'title', this.value)" placeholder="Название момента" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500">
              <input type="text" value="${escapeHtml(item.time)}" oninput="updateMainMoment('${item.id}', 'time', this.value)" placeholder="3:10" class="w-24 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs font-mono text-amber-400 placeholder-slate-600 focus:outline-none focus:border-amber-500">

              <button onclick="moveMainMoment(${idx}, 'up')" class="p-1.5 hover:bg-slate-800 text-slate-400 rounded-lg cursor-pointer" title="Вверх"><i data-lucide="arrow-up" class="w-3.5 h-3.5"></i></button>
              <button onclick="moveMainMoment(${idx}, 'down')" class="p-1.5 hover:bg-slate-800 text-slate-400 rounded-lg cursor-pointer" title="Вниз"><i data-lucide="arrow-down" class="w-3.5 h-3.5"></i></button>
              <button onclick="deleteMainMoment('${item.id}')" class="p-1.5 hover:bg-red-950/50 text-slate-500 hover:text-red-400 rounded-lg cursor-pointer" title="Удалить"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>

            ${linkPreview ? `
              <div class="pl-7 text-[11px] font-mono text-slate-500 flex items-center space-x-1 truncate">
                <span class="text-slate-600">Ссылка:</span>
                <span class="text-slate-400 underline decoration-slate-800 truncate">${escapeHtml(linkPreview)}</span>
              </div>
            ` : ''}

            ${subHtml}

            <div class="pl-7 pt-1">
              <button onclick="addSubMoment('${item.id}')" class="text-[11px] text-amber-400/80 hover:text-amber-300 flex items-center space-x-1 cursor-pointer">
                <i data-lucide="plus" class="w-3 h-3"></i>
                <span>Добавить подпункт</span>
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      lucide.createIcons();
      updateOutput();
    }

    function addMainMoment() {
      state.mainMoments.push({
        id: 'm_' + Date.now(),
        title: '',
        time: '',
        videoUrlOverride: '',
        subMoments: []
      });
      renderMainMoments();
    }

    function updateMainMoment(id, key, val) {
      const item = state.mainMoments.find(m => m.id === id);
      if (item) {
        item[key] = val;
        updateOutput();
      }
    }

    function deleteMainMoment(id) {
      state.mainMoments = state.mainMoments.filter(m => m.id !== id);
      renderMainMoments();
    }

    function moveMainMoment(idx, dir) {
      if (dir === 'up' && idx > 0) {
        const temp = state.mainMoments[idx];
        state.mainMoments[idx] = state.mainMoments[idx - 1];
        state.mainMoments[idx - 1] = temp;
      } else if (dir === 'down' && idx < state.mainMoments.length - 1) {
        const temp = state.mainMoments[idx];
        state.mainMoments[idx] = state.mainMoments[idx + 1];
        state.mainMoments[idx + 1] = temp;
      }
      renderMainMoments();
    }

    function addSubMoment(mainId) {
      const item = state.mainMoments.find(m => m.id === mainId);
      if (item) {
        if (!item.subMoments) item.subMoments = [];
        item.subMoments.push({ id: 'sm_' + Date.now(), title: '', time: '' });
        renderMainMoments();
      }
    }

    function updateSubMoment(mainId, subId, key, val) {
      const item = state.mainMoments.find(m => m.id === mainId);
      if (item && item.subMoments) {
        const sub = item.subMoments.find(s => s.id === subId);
        if (sub) {
          sub[key] = val;
          updateOutput();
        }
      }
    }

    function deleteSubMoment(mainId, subId) {
      const item = state.mainMoments.find(m => m.id === mainId);
      if (item && item.subMoments) {
        item.subMoments = item.subMoments.filter(s => s.id !== subId);
        renderMainMoments();
      }
    }

    // --- Extra Streams Renders & Logic ---

    function renderExtraStreams() {
      const container = document.getElementById('extraStreamsList');
      if (state.extraStreams.length === 0) {
        container.innerHTML = `
          <div class="text-center py-6 border border-dashed border-slate-800 rounded-xl bg-slate-950/20">
            <p class="text-xs text-slate-500 mb-2">Дополнительные стримы не добавлены</p>
            <button onclick="addExtraStream()" class="inline-flex items-center space-x-1 px-3 py-1.5 bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-xl text-xs font-semibold transition-all cursor-pointer">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Добавить дополнительный стрим</span>
            </button>
          </div>
        `;
        lucide.createIcons();
        updateOutput();
        return;
      }

      let html = '';
      state.extraStreams.forEach((stream) => {
        let momentsHtml = '';
        stream.moments.forEach((item, mIdx) => {
          let subHtml = '';
          if (item.subMoments && item.subMoments.length > 0) {
            subHtml = `<div class="mt-2 pl-4 space-y-2 border-l-2 border-purple-500/20">`;
            item.subMoments.forEach((sub) => {
              subHtml += `
                <div class="flex items-center space-x-2">
                  <span class="text-[11px] text-slate-500 font-mono">-</span>
                  <input type="text" value="${escapeHtml(sub.title)}" oninput="updateExtraSubMoment('${stream.id}', '${item.id}', '${sub.id}', 'title', this.value)" placeholder="Название подпункта" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500">
                  <input type="text" value="${escapeHtml(sub.time)}" oninput="updateExtraSubMoment('${stream.id}', '${item.id}', '${sub.id}', 'time', this.value)" placeholder="21:45" class="w-20 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs font-mono text-purple-300 placeholder-slate-600 focus:outline-none focus:border-purple-500">
                  <button onclick="deleteExtraSubMoment('${stream.id}', '${item.id}', '${sub.id}')" class="p-1 hover:bg-red-950/50 text-slate-500 hover:text-red-400 rounded-lg transition-colors cursor-pointer">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              `;
            });
            subHtml += `</div>`;
          }

          momentsHtml += `
            <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 space-y-2">
              <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-slate-500 font-mono w-5">${mIdx + 1})</span>
                <input type="text" value="${escapeHtml(item.title)}" oninput="updateExtraMoment('${stream.id}', '${item.id}', 'title', this.value)" placeholder="Название момента" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500">
                <input type="text" value="${escapeHtml(item.time)}" oninput="updateExtraMoment('${stream.id}', '${item.id}', 'time', this.value)" placeholder="0:00" class="w-24 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs font-mono text-purple-300 placeholder-slate-600 focus:outline-none focus:border-purple-500">
                <button onclick="deleteExtraMoment('${stream.id}', '${item.id}')" class="p-1.5 hover:bg-red-950/50 text-slate-500 hover:text-red-400 rounded-lg cursor-pointer"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>

              ${subHtml}

              <div class="pl-7 pt-1">
                <button onclick="addExtraSubMoment('${stream.id}', '${item.id}')" class="text-[11px] text-purple-400 hover:text-purple-300 flex items-center space-x-1 cursor-pointer">
                  <i data-lucide="plus" class="w-3 h-3"></i>
                  <span>Добавить подпункт</span>
                </button>
              </div>
            </div>
          `;
        });

        html += `
          <div class="bg-slate-950/60 border border-purple-500/20 rounded-xl p-4 space-y-3">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800/80">
              <input type="text" value="${escapeHtml(stream.title)}" oninput="updateExtraStreamHeader('${stream.id}', 'title', this.value)" placeholder="Заголовок (например: Ночной)" class="bg-transparent text-xs font-bold text-purple-300 focus:outline-none border-b border-purple-500/40 px-1 py-0.5">
              <button onclick="deleteExtraStream('${stream.id}')" class="text-xs text-red-400 hover:text-red-300 flex items-center space-x-1 cursor-pointer">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                <span>Удалить блок</span>
              </button>
            </div>

            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Ссылка на стрим</label>
              <input type="text" value="${escapeHtml(stream.streamUrl)}" oninput="updateExtraStreamHeader('${stream.id}', 'streamUrl', this.value)" placeholder="https://youtu.be/D4BAEt_m-LA" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500">
            </div>

            <div class="space-y-2">
              <label class="block text-[11px] font-medium text-slate-400">Моменты в этом стриме:</label>
              ${momentsHtml || `<p class="text-xs text-slate-600 italic">Нет моментов</p>`}
            </div>

            <button onclick="addExtraMoment('${stream.id}')" class="text-xs text-purple-300 hover:text-purple-200 flex items-center space-x-1 pt-1 cursor-pointer font-semibold">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Добавить момент в этот стрим</span>
            </button>
          </div>
        `;
      });

      container.innerHTML = html;
      lucide.createIcons();
      updateOutput();
    }

    function addExtraStream() {
      state.extraStreams.push({
        id: 'es_' + Date.now(),
        title: 'Ночной',
        streamUrl: '',
        moments: []
      });
      renderExtraStreams();
    }

    function updateExtraStreamHeader(id, key, val) {
      const st = state.extraStreams.find(s => s.id === id);
      if (st) {
        st[key] = val;
        updateOutput();
      }
    }

    function deleteExtraStream(id) {
      state.extraStreams = state.extraStreams.filter(s => s.id !== id);
      renderExtraStreams();
    }

    function addExtraMoment(streamId) {
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        st.moments.push({ id: 'em_' + Date.now(), title: '', time: '', videoUrlOverride: '', subMoments: [] });
        renderExtraStreams();
      }
    }

    function updateExtraMoment(streamId, momentId, key, val) {
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        const m = st.moments.find(item => item.id === momentId);
        if (m) {
          m[key] = val;
          updateOutput();
        }
      }
    }

    function deleteExtraMoment(streamId, momentId) {
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        st.moments = st.moments.filter(m => m.id !== momentId);
        renderExtraStreams();
      }
    }

    function addExtraSubMoment(streamId, momentId) {
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        const m = st.moments.find(item => item.id === momentId);
        if (m) {
          if (!m.subMoments) m.subMoments = [];
          m.subMoments.push({ id: 'esm_' + Date.now(), title: '', time: '' });
          renderExtraStreams();
        }
      }
    }

    function updateExtraSubMoment(streamId, momentId, subId, key, val) {
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        const m = st.moments.find(item => item.id === momentId);
        if (m && m.subMoments) {
          const sub = m.subMoments.find(s => s.id === subId);
          if (sub) {
            sub[key] = val;
            updateOutput();
          }
        }
      }
    }

    function deleteExtraSubMoment(streamId, momentId, subId) {
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        const m = st.moments.find(item => item.id === momentId);
        if (m && m.subMoments) {
          m.subMoments = m.subMoments.filter(s => s.id !== subId);
          renderExtraStreams();
        }
      }
    }

    // --- Init & Event Binding ---

    document.addEventListener('DOMContentLoaded', () => {
      // Main Meta Listeners
      document.getElementById('streamDate').addEventListener('input', (e) => {
        state.streamDate = e.target.value;
        updateOutput();
      });

      document.getElementById('mainTitle').addEventListener('input', (e) => {
        state.mainTitle = e.target.value;
        updateOutput();
      });

      document.getElementById('videoId').addEventListener('input', (e) => {
        state.videoId = e.target.value;
        updateBadge();
        updateOutput();
      });

      document.getElementById('hashtags').addEventListener('input', (e) => {
        state.hashtags = e.target.value;
        updateOutput();
      });

      // Clear button
      document.getElementById('clearBtn').addEventListener('click', () => {
        state.streamDate = '';
        state.mainTitle = 'Основной';
        state.videoId = '';
        state.hashtags = '';
        state.mainMoments = [];
        state.extraStreams = [];
        state.activeSeekTime = null;

        document.getElementById('streamDate').value = '';
        document.getElementById('mainTitle').value = 'Основной';
        document.getElementById('videoId').value = '';
        document.getElementById('hashtags').value = '';

        updateBadge();
        renderMainMoments();
        renderExtraStreams();
        showToast('Форма полностью очищена');
      });

      // Tabs switching
      const textBtn = document.getElementById('tabTextBtn');
      const embedBtn = document.getElementById('tabEmbedBtn');
      const textContent = document.getElementById('tabTextContent');
      const embedContent = document.getElementById('tabEmbedContent');

      textBtn.addEventListener('click', () => {
        textBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer bg-amber-500/10 text-amber-400 border border-amber-500/30';
        embedBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-800';
        textContent.classList.remove('hidden');
        embedContent.classList.add('hidden');
      });

      embedBtn.addEventListener('click', () => {
        embedBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer bg-amber-500/10 text-amber-400 border border-amber-500/30';
        textBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-800';
        embedContent.classList.remove('hidden');
        textContent.classList.add('hidden');
        updatePlayerTab();
      });

      // Copy Button
      document.getElementById('copyBtn').addEventListener('click', () => {
        const area = document.getElementById('outputArea');
        if (!area.value) return;
        navigator.clipboard.writeText(area.value);
        showToast('Текст успешно скопирован!');
      });

      // Render initial clean view
      renderMainMoments();
      renderExtraStreams();
    });
  </script>
</body>
</html>
