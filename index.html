<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-slate-950 pb-16">

              <button onclick="addMainMoment('Пятёрка смотрит &quot;&quot;')" class="inline-flex items-center space-x-1 px-2.5 py-1 bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-xl text-xs font-semibold transition-all cursor-pointer" title="Добавить 'Пятёрка смотрит &quot;&quot;'">

      <!-- Right Column: Player Preview & Text Output -->

        <!-- Container for all Stream Players (Main + Extra Streams with links) -->
        <div id="allPlayersContainer" class="space-y-6"></div>

        <!-- Card 2: Formatted Description Text -->
        <div class="bg-slate-900/80 backdrop-blur-sm border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h2 class="text-sm font-semibold text-slate-200 flex items-center space-x-2">
              <i data-lucide="file-text" class="w-4 h-4 text-amber-400"></i>
              <span>Текст описания</span>
            </h2>

            <button id="copyBtn" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 transition-all shadow-md shadow-amber-500/10 cursor-pointer">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i>
              <span id="copyBtnText">Скопировать</span>
            </button>
          </div>

          <div class="space-y-3">
            <textarea id="outputArea" readonly rows="12" placeholder="Здесь будет сгенерированный текст таймкодов..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs font-mono text-slate-200 focus:outline-none resize-none leading-relaxed select-all placeholder-slate-700"></textarea>

            <div class="flex items-center justify-between text-xs text-slate-500 px-1">
              <span>Символов: <strong id="charCount" class="text-slate-300">0</strong></span>
              <a id="externalOpenLink" href="#" target="_blank" rel="noreferrer" class="hidden inline-flex items-center space-x-1 text-amber-400/80 hover:text-amber-300 transition-colors">
                <span id="externalOpenLabel">Открыть</span>

      </div>

    </div>

  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 pointer-events-none"></div>

  <!-- Vanilla JS Logic -->
  <script>
    // --- Initial Clean State ---
    let state = {
      streamDate: '',
      mainTitle: 'Основной',
      videoId: '',
      hashtags: '',
      mainMoments: [],
      extraStreams: [],
      activePlayerStreamId: 'all',
      activeSeekTimes: {},
      playerViewMode: 'phone'
    };

    // --- Utilities ---

    function detectPlatform(input) {
      if (!input) return 'unknown';
      const trimmed = input.trim().toLowerCase();
      if (trimmed.includes('twitch.tv') || trimmed.includes('clips.twitch.tv')) return 'twitch';
      if (trimmed.includes('kick.com')) return 'kick';
      if (trimmed.includes('live.vkvideo.ru') || trimmed.includes('vk.com/live')) return 'vk_live';
      if (trimmed.includes('vkvideo.ru') || trimmed.includes('vk.com/video')) return 'vk';
      if (trimmed.includes('youtube.com') || trimmed.includes('youtu.be')) return 'youtube';
      if (/^[a-zA-Z0-9_-]{11}$/.test(input.trim())) return 'youtube';
      return 'unknown';
    }

    function timeToSeconds(timeStr) {
      if (!timeStr) return 0;
      const clean = timeStr.trim().toLowerCase().replace(/[()]/g, '');

      if (/^\d+$/.test(clean)) return parseInt(clean, 10);

      if (/^(\d+h)?(\d+m)?(\d+s)?$/.test(clean) && clean.length > 0) {
        const hMatch = clean.match(/(\d+)h/);
        const mMatch = clean.match(/(\d+)m/);
        const sMatch = clean.match(/(\d+)s/);
        const h = hMatch ? parseInt(hMatch[1], 10) : 0;
        const m = mMatch ? parseInt(mMatch[1], 10) : 0;
        const s = sMatch ? parseInt(sMatch[1], 10) : 0;
        return h * 3600 + m * 60 + s;
      }

      const parts = clean.split(':').map(p => parseInt(p, 10));
      if (!parts.some(isNaN)) {
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 1) return parts[0];
      }
      return 0;
    }

    function parseTimeToParam(timeStr, platform) {
      if (!timeStr) return '';
      const clean = timeStr.trim().toLowerCase().replace(/[()]/g, '');
      if (!clean || clean === '0:00' || clean === '0' || clean === '00:00') return '';

      const totalSecs = timeToSeconds(clean);
      if (totalSecs === 0) return '';

      // Kick & VK Live require raw seconds
      if (platform === 'kick' || platform === 'vk_live') {
        return String(totalSecs);
      }

      // YouTube, Twitch, VK Video use h/m/s
      const hours = Math.floor(totalSecs / 3600);
      const minutes = Math.floor((totalSecs % 3600) / 60);
      const seconds = totalSecs % 60;

      let res = '';
      if (hours > 0) res += `${hours}h`;
      if (minutes > 0 || hours > 0) res += `${minutes}m`;
      if (seconds > 0) res += `${seconds}s`;
      return res || '';
    }

    function extractVideoId(input) {
      if (!input) return '';
      const trimmed = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;

      // Common YouTube patterns: watch?v=, live/, shorts/, embed/, v/, youtu.be/
      const match = trimmed.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/|shorts\/))([\w-]{11})/i);
      if (match && match[1]) return match[1];

      // Query parameter v=
      const vMatch = trimmed.match(/[?&]v=([\w-]{11})/i);
      if (vMatch && vMatch[1]) return vMatch[1];

      // Any path with /live/, /shorts/, /embed/, /v/
      const pathMatch = trimmed.match(/\/(?:live|shorts|embed|v)\/([\w-]{11})/i);
      if (pathMatch && pathMatch[1]) return pathMatch[1];

      return '';
    }

    function getTwitchParentParams() {
      const host = window.location.hostname || 'localhost';
      const parentDomains = new Set([
        host,
        'localhost',
        '127.0.0.1',
        'ai.studio',
        'google.com',
        'googleusercontent.com',
        'run.app',
        'asia-east1.run.app'
      ]);

      try {
        if (window.parent && window.parent.location && window.parent.location.hostname) {
          parentDomains.add(window.parent.location.hostname);
        }
      } catch (e) {}

      if (host && host.includes('.')) {
        const parts = host.split('.');
        for (let i = 0; i < parts.length - 1; i++) {
          const domainCandidate = parts.slice(i).join('.');
          if (domainCandidate.length > 3) parentDomains.add(domainCandidate);
        }
      }

      return Array.from(parentDomains).filter(Boolean).map(p => `parent=${encodeURIComponent(p)}`).join('&');
    }

    function extractTwitchTimeSecs(url) {
      if (!url) return null;
      const match = url.match(/[?&]t=([0-9hms]+)/i);
      if (!match) return null;
      const tStr = match[1];
      let total = 0;
      const hMatch = tStr.match(/(\d+)h/i);
      const mMatch = tStr.match(/(\d+)m/i);
      const sMatch = tStr.match(/(\d+)s/i);
      if (hMatch) total += parseInt(hMatch[1]) * 3600;
      if (mMatch) total += parseInt(mMatch[1]) * 60;
      if (sMatch) total += parseInt(sMatch[1]);
      if (!hMatch && !mMatch && !sMatch && /^\d+$/.test(tStr)) {
        total = parseInt(tStr);
      }
      return total > 0 ? total : null;
    }

    function extractYouTubeTimeSecs(url) {
      if (!url) return null;
      const match = url.match(/[?&](?:t|start)=([0-9hms]+)/i);
      if (!match) return null;
      const tStr = match[1];
      let total = 0;
      const hMatch = tStr.match(/(\d+)h/i);
      const mMatch = tStr.match(/(\d+)m/i);
      const sMatch = tStr.match(/(\d+)s/i);
      if (hMatch) total += parseInt(hMatch[1], 10) * 3600;
      if (mMatch) total += parseInt(mMatch[1], 10) * 60;
      if (sMatch) total += parseInt(sMatch[1], 10);
      if (!hMatch && !mMatch && !sMatch && /^\d+$/.test(tStr)) {
        total = parseInt(tStr, 10);
      }
      return total > 0 ? total : null;
    }

    function getEmbedInfo(url, seekSecs) {
      if (!url) return null;
      const trimmed = url.trim();

      // 1. YouTube (watch, live, shorts, embed, youtu.be)
      const ytId = extractVideoId(trimmed);
      if (ytId) {
        const urlTimeSecs = extractYouTubeTimeSecs(trimmed);
        const secs = seekSecs !== null ? seekSecs : urlTimeSecs;
        const startParam = secs !== null && secs > 0 ? `&start=${secs}` : '';
        return {
          platform: 'YouTube',
          embedUrl: `https://www.youtube.com/embed/${ytId}?autoplay=0&enablejsapi=1&rel=0${startParam}`,
          allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen'
        };
      }

      // 2. Twitch (Live, VOD, Clip)
      if (trimmed.includes('twitch.tv')) {
        const parentParams = getTwitchParentParams();
        const initialTwitchTime = extractTwitchTimeSecs(trimmed);
        const effectiveSecs = seekSecs !== null ? seekSecs : initialTwitchTime;

        const clipMatch = trimmed.match(/(?:clips\.twitch\.tv\/|twitch\.tv\/[^\/]+\/clip\/)([a-zA-Z0-9_-]+)/i);
        if (clipMatch) {
          return {
            platform: 'Twitch Клип',
            embedUrl: `https://clips.twitch.tv/embed?clip=${clipMatch[1]}&${parentParams}`,
            allow: 'autoplay; fullscreen; picture-in-picture',
            isTwitch: true,
            directUrl: `https://clips.twitch.tv/${clipMatch[1]}`
          };
        }

        const vodMatch = trimmed.match(/twitch\.tv\/videos\/(\d+)/i);
        if (vodMatch) {
          const timeParam = effectiveSecs !== null && effectiveSecs > 0 ? `&time=${effectiveSecs}s` : '';
          return {
            platform: 'Twitch VOD',
            embedUrl: `https://player.twitch.tv/?video=${vodMatch[1]}&${parentParams}&autoplay=false${timeParam}`,
            allow: 'autoplay; fullscreen; picture-in-picture',
            isTwitch: true,
            directUrl: buildTimestampLink(trimmed, effectiveSecs !== null ? effectiveSecs + 's' : '')
          };
        }

        const channelMatch = trimmed.match(/twitch\.tv\/([a-zA-Z0-9_]+)/i);
        if (channelMatch && !['videos', 'directory', 'downloads', 'p', 'clips'].includes(channelMatch[1].toLowerCase())) {
          return {
            platform: 'Twitch Live',
            embedUrl: `https://player.twitch.tv/?channel=${channelMatch[1]}&${parentParams}&autoplay=false`,
            allow: 'autoplay; fullscreen; picture-in-picture',
            isTwitch: true,
            directUrl: `https://www.twitch.tv/${channelMatch[1]}`
          };
        }
      }

      // 3. VK Video & VK Clips
      const vkVideoMatch = trimmed.match(/video(-?\d+)_(\d+)/i);
      if (vkVideoMatch) {
        const timeParam = seekSecs !== null && seekSecs > 0 ? `&t=${seekSecs}s` : '';
        return {
          platform: 'VK Видео',
          embedUrl: `https://vk.com/video_ext.php?oid=${vkVideoMatch[1]}&id=${vkVideoMatch[2]}&hash=&hd=2${timeParam}`,
          allow: 'autoplay; encrypted-media; fullscreen'
        };
      }

      const vkExtMatch = trimmed.match(/vk\.com\/video_ext\.php\?([^"'\s]+)/i);
      if (vkExtMatch) {
        return {
          platform: 'VK Видео',
          embedUrl: `https://vk.com/video_ext.php?${vkExtMatch[1]}`,
          allow: 'autoplay; encrypted-media; fullscreen'
        };
      }

      const vkClipMatch = trimmed.match(/clip(-?\d+)_(\d+)/i);
      if (vkClipMatch) {
        return {
          platform: 'VK Клипы',
          embedUrl: `https://vk.com/video_ext.php?oid=${vkClipMatch[1]}&id=${vkClipMatch[2]}&hash=&hd=2`,
          allow: 'autoplay; encrypted-media; fullscreen'
        };
      }

      // 4. VK Live / VK Play Live
      if (trimmed.includes('live.vkvideo.ru') || trimmed.includes('vkplay.live') || trimmed.includes('live.vkplay.ru') || trimmed.includes('vk.com/live')) {
        const vkLiveChannel = trimmed.match(/(?:live\.vkvideo\.ru|vkplay\.live|live\.vkplay\.ru|vk\.com\/live)\/([a-zA-Z0-9_.-]+)/i);
        if (vkLiveChannel && vkLiveChannel[1] !== 'app') {
          return {
            platform: 'VK Live',
            embedUrl: `https://live.vkvideo.ru/app/embed/${vkLiveChannel[1]}`,
            allow: 'autoplay; encrypted-media; fullscreen'
          };
        }
      }

      // 5. Kick (Live, VOD, Clip)
      if (trimmed.includes('kick.com')) {
        const kickClipMatch = trimmed.match(/kick\.com\/(?:clips\/|[^\/]+\?clip=)([a-zA-Z0-9_-]+)/i);
        if (kickClipMatch) {
          return {
            platform: 'Kick Клип',
            embedUrl: `https://player.kick.com/clips/${kickClipMatch[1]}`,
            allow: 'autoplay; fullscreen'
          };
        }

        const kickVideoMatch = trimmed.match(/kick\.com\/(?:video\/|[^\/]+\/videos\/)([a-zA-Z0-9_-]+)/i);
        if (kickVideoMatch) {
          return {
            platform: 'Kick VOD',
            embedUrl: `https://player.kick.com/video/${kickVideoMatch[1]}`,
            allow: 'autoplay; fullscreen'
          };
        }

        const kickChannelMatch = trimmed.match(/kick\.com\/([a-zA-Z0-9_]+)/i);
        if (kickChannelMatch && !['video', 'category', 'clips'].includes(kickChannelMatch[1].toLowerCase())) {
          return {
            platform: 'Kick',
            embedUrl: `https://player.kick.com/${kickChannelMatch[1]}`,
            allow: 'autoplay; fullscreen'
          };
        }
      }

      // 6. Rutube
      if (trimmed.includes('rutube.ru')) {
        const rutubeMatch = trimmed.match(/rutube\.ru\/(?:video|play\/embed)\/([a-zA-Z0-9_-]+)/i);
        if (rutubeMatch) {
          const timeParam = seekSecs !== null && seekSecs > 0 ? `?t=${seekSecs}` : '';
          return {
            platform: 'Rutube',
            embedUrl: `https://rutube.ru/play/embed/${rutubeMatch[1]}/${timeParam}`,
            allow: 'autoplay; encrypted-media; fullscreen'
          };
        }
      }

      return null;
    }

    function appendTimestampToUrl(baseUrl, timeStr) {
      if (!baseUrl) return '';
      const platform = detectPlatform(baseUrl);
      const param = parseTimeToParam(timeStr, platform);
      if (!param) return baseUrl;

      if (platform === 'vk_live') {
        const cleanUrl = baseUrl.replace(/([?&])(tc|t|time|at)=[^&]*/g, '$1').replace(/[?&]$/, '').replace(/\?&/, '?');
        const joiner = cleanUrl.includes('?') ? '&' : '?';
        return `${cleanUrl}${joiner}tc=${param}`;
      }

      const cleanUrl = baseUrl.replace(/([?&])(tc|t|time|at)=[^&]*/g, '$1').replace(/[?&]$/, '').replace(/\?&/, '?');
      const joiner = cleanUrl.includes('?') ? '&' : '?';
      return `${cleanUrl}${joiner}t=${param}`;
    }

    function buildTimestampLink(rawUrlOrId, timeStr, customUrlOverride) {
      if (customUrlOverride && customUrlOverride.trim()) {
        return appendTimestampToUrl(customUrlOverride.trim(), timeStr);
      }
      if (!rawUrlOrId || !rawUrlOrId.trim()) return '';

      const input = rawUrlOrId.trim();
      const platform = detectPlatform(input);

      if (platform === 'youtube') {
        const cleanId = extractVideoId(input);
        if (cleanId) {
          const baseHost = `https://youtu.be/${cleanId}`;
          const param = parseTimeToParam(timeStr, 'youtube');
          return param ? `${baseHost}?t=${param}` : baseHost;
        }
      }

      if (input.startsWith('http://') || input.startsWith('https://')) {
        return appendTimestampToUrl(input, timeStr);
      }

      const param = parseTimeToParam(timeStr, platform);
      return param ? `${input}?t=${param}` : input;
    }

    // --- Text Output Generator ---

    function generateFormattedText() {
      let lines = [];

      // Date Header
      if (state.streamDate.trim()) {
        lines.push(`Запись за ${state.streamDate.trim()}`);
        lines.push('');
      }

      const hasMain = state.mainMoments.length > 0;
      const hasExtra = state.extraStreams.some(s => s.moments.length > 0);

      if (hasMain || hasExtra) {
        lines.push('Интересные моменты стрима:');
      }

      // Main Section
      if (hasMain) {
        const mTitle = state.mainTitle.trim() || 'Основной';
        lines.push(`${mTitle}:`);

        state.mainMoments.forEach((item, idx) => {
          const num = idx + 1;
          const timeTag = item.time.trim() ? ` (${item.time.trim()})` : '';
          lines.push(`${num}) ${item.title.trim()}${timeTag}`);
          const link = buildTimestampLink(state.videoId, item.time, item.videoUrlOverride);
          if (link) lines.push(link);

          if (item.subMoments && item.subMoments.length > 0) {
            item.subMoments.forEach(sub => {
              const subTimeTag = sub.time.trim() ? ` (${sub.time.trim()})` : '';
              lines.push(`- ${sub.title.trim()}${subTimeTag}`);
              const subLink = buildTimestampLink(state.videoId, sub.time, sub.videoUrlOverride);
              if (subLink) lines.push(subLink);
            });
          }
          lines.push('');
        });
      }

      // Additional Streams
      if (hasExtra) {
        state.extraStreams.forEach((stream) => {
          if (stream.moments.length > 0) {
            const sTitle = stream.title.trim() || 'Дополнительный';
            lines.push(`${sTitle}:`);
            const sUrl = stream.streamUrl.trim() || state.videoId.trim();

            stream.moments.forEach((item, idx) => {
              const num = idx + 1;
              const timeTag = item.time.trim() ? ` (${item.time.trim()})` : '';
              lines.push(`${num}) ${item.title.trim()}${timeTag}`);

              const link = buildTimestampLink(sUrl, item.time, item.videoUrlOverride);
              if (link) lines.push(link);

              if (item.subMoments && item.subMoments.length > 0) {
                item.subMoments.forEach(sub => {
                  const subTimeTag = sub.time.trim() ? ` (${sub.time.trim()})` : '';
                  lines.push(`- ${sub.title.trim()}${subTimeTag}`);
                  const subLink = buildTimestampLink(sUrl, sub.time, sub.videoUrlOverride);
                  if (subLink) lines.push(subLink);
                });
              }
              lines.push('');
            });
          }
        });
      }

      // Hashtags
      if (state.hashtags.trim()) {
        if (lines.length > 0 && lines[lines.length - 1] !== '') {
          lines.push('');
        }
        lines.push(state.hashtags.trim());
      }

      // Remove trailing blank lines
      while (lines.length > 0 && lines[lines.length - 1] === '') {
        lines.pop();
      }

      return lines.join('\n');
    }

    // --- UI Render & Helpers ---

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast-animate bg-amber-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold shadow-xl flex items-center space-x-2 border border-amber-300';
      toast.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>${msg}</span>`;
      const container = document.getElementById('toastContainer');
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.remove(), 2600);
    }

    function updateBadge() {
      const badgeContainer = document.getElementById('platformBadge');
      if (!badgeContainer) return;
      const inputVal = state.videoId.trim();
      if (!inputVal) {
        badgeContainer.innerHTML = '';
        return;
      }

      const platform = detectPlatform(inputVal);

      if (platform === 'youtube') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-red-500/10 text-red-400 border border-red-500/20 px-2 py-0.5 rounded-md">YouTube</span>`;
      } else if (platform === 'twitch') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-purple-500/10 text-purple-400 border border-purple-500/20 px-2 py-0.5 rounded-md">Twitch</span>`;
      } else if (platform === 'kick') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md">Kick</span>`;
      } else if (platform === 'vk_live') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-md">VK Live</span>`;
      } else if (platform === 'vk') {
        badgeContainer.innerHTML = `<span class="text-[10px] font-mono font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 px-2 py-0.5 rounded-md">VK Video</span>`;
      } else {
        badgeContainer.innerHTML = '';
      }
    }

    function updateOutput() {
      const text = generateFormattedText();
      document.getElementById('outputArea').value = text;
      document.getElementById('charCount').innerText = text.length;

      const link = document.getElementById('externalOpenLink');
      const label = document.getElementById('externalOpenLabel');
      if (state.videoId.trim()) {
        const platform = detectPlatform(state.videoId);
        const platformLabel = platform === 'youtube' ? 'YouTube' : platform === 'twitch' ? 'Twitch' : platform === 'kick' ? 'Kick' : platform === 'vk_live' ? 'VK Live' : platform === 'vk' ? 'VK Видео' : 'Платформе';
        label.innerText = `Открыть на ${platformLabel}`;
        link.href = buildTimestampLink(state.videoId, '');
        link.classList.remove('hidden');
      } else {
        link.classList.add('hidden');
      }

      updatePlayerTab();
    }

    function formatSecondsToHHMMSS(totalSecs) {
      if (totalSecs === null || totalSecs === undefined || isNaN(totalSecs) || totalSecs < 0) return '0:00';
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = Math.floor(totalSecs % 60);
      const mStr = (h > 0 && m < 10) ? '0' + m : String(m);
      const sStr = s < 10 ? '0' + s : String(s);
      return h > 0 ? `${h}:${mStr}:${sStr}` : `${mStr}:${sStr}`;
    }

    function getStreamById(streamId) {
      if (streamId === 'main') {
        return {
          id: 'main',
          title: state.mainTitle.trim() || 'Основной',
          url: state.videoId.trim(),
          moments: state.mainMoments,
          isMain: true
        };
      }
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        return {
          id: st.id,
          title: st.title.trim() || 'Доп. стрим',
          url: st.streamUrl.trim() || state.videoId.trim(),
          moments: st.moments,
          isMain: false
        };
      }
      return null;
    }

    function switchPlayerStream(streamId) {
      state.activePlayerStreamId = streamId;
      state.activeSeekTime = null;
      updatePlayerTab();
    }

    function updateStreamCurrentTimeUI(streamId, curSecs) {
      if (curSecs === null || curSecs === undefined || curSecs < 0 || isNaN(curSecs)) return;
      state.activeSeekTimes[streamId] = curSecs;

      const cardEl = document.getElementById(`player-card-${streamId}`);
      if (!cardEl) return;

      const timeStr = formatSecondsToHHMMSS(curSecs);

      // 1. Update text input value if not currently focused by user
      const inputEl = cardEl.querySelector('.frame-time-input');
      if (inputEl && document.activeElement !== inputEl) {
        if (inputEl.value !== timeStr) {
          inputEl.value = timeStr;
        }
      }

      // 2. Highlight matching moment chip
      const chips = cardEl.querySelectorAll('.moment-chip-btn');
      chips.forEach(chip => {
        const chipSecs = parseInt(chip.getAttribute('data-secs'), 10);
        const isSel = (chipSecs === curSecs);
        if (isSel) {
          chip.className = "moment-chip-btn shrink-0 px-2.5 py-1.5 rounded-xl border text-xs font-medium flex items-center space-x-1.5 transition-all active:scale-95 cursor-pointer bg-amber-500 text-slate-950 font-bold border-amber-400 shadow-md shadow-amber-500/20";
        } else {
          chip.className = "moment-chip-btn shrink-0 px-2.5 py-1.5 rounded-xl border text-xs font-medium flex items-center space-x-1.5 transition-all active:scale-95 cursor-pointer bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-800 hover:border-amber-500/40";
        }
      });
    }

    function seekToStreamTime(streamId, secs) {
      state.activeSeekTimes[streamId] = secs;
      updateStreamCurrentTimeUI(streamId, secs);
      updatePlayerTab();

      // Force re-seek on every click (even consecutive clicks on the same timestamp)
      setTimeout(() => {
        const cardEl = document.getElementById(`player-card-${streamId}`);
        if (cardEl) {
          const iframe = cardEl.querySelector('iframe');
          const stream = getStreamById(streamId);
          if (iframe && stream && stream.url) {
            const embedInfo = getEmbedInfo(stream.url, secs);
            if (embedInfo && embedInfo.embedUrl) {
              let reseekUrl = embedInfo.embedUrl;
              const nonce = Date.now();
              const sep = reseekUrl.includes('?') ? '&' : '?';
              reseekUrl += `${sep}_ts=${nonce}&autoplay=1`;
              iframe.src = reseekUrl;

              try {
                iframe.contentWindow.postMessage(JSON.stringify({
                  event: 'command',
                  func: 'seekTo',
                  args: [secs, true]
                }), '*');
              } catch (e) {}
            }
          }
        }
      }, 10);
    }

    function adjustStreamSeekTime(streamId, deltaSecs) {
      const current = state.activeSeekTimes[streamId] || 0;
      seekToStreamTime(streamId, Math.max(0, current + deltaSecs));
    }

    function handleManualTimeSeek(streamId, val) {
      if (!val) return;
      const secs = timeToSeconds(val.trim());
      seekToStreamTime(streamId, secs);
    }

    function addCurrentTimeMoment(streamId) {
      const secs = state.activeSeekTimes[streamId] || 0;
      const timeStr = formatSecondsToHHMMSS(secs);

      if (streamId === 'main') {
        state.mainMoments.push({
          id: 'm_' + Date.now() + Math.random().toString(36).substr(2, 4),
          title: '',
          time: timeStr,
          videoUrlOverride: '',
          subMoments: []
        });
        renderMainMoments();
        showToast(`Момент (${timeStr}) добавлен в список!`);
      } else {
        const extra = state.extraStreams.find(s => s.id === streamId);
        if (extra) {
          extra.moments.push({
            id: 'em_' + Date.now() + Math.random().toString(36).substr(2, 4),
            title: '',
            time: timeStr,
            videoUrlOverride: '',
            subMoments: []
          });
          renderExtraStreams();
          showToast(`Момент (${timeStr}) добавлен в ${extra.title || 'доп. стрим'}!`);
        }
      }
    }

    function addCurrentTimeReaction(streamId) {
      const secs = state.activeSeekTimes[streamId] || 0;
      const timeStr = formatSecondsToHHMMSS(secs);

      if (streamId === 'main') {
        state.mainMoments.push({
          id: 'm_' + Date.now() + Math.random().toString(36).substr(2, 4),
          title: 'Пятёрка смотрит ""',
          time: timeStr,
          videoUrlOverride: '',
          subMoments: []
        });
        renderMainMoments();
        showToast(`Реакция (${timeStr}) добавлена!`);
      } else {
        const extra = state.extraStreams.find(s => s.id === streamId);
        if (extra) {
          extra.moments.push({
            id: 'em_' + Date.now() + Math.random().toString(36).substr(2, 4),
            title: 'Пятёрка смотрит ""',
            time: timeStr,
            videoUrlOverride: '',
            subMoments: []
          });
          renderExtraStreams();
          showToast(`Реакция (${timeStr}) добавлена!`);
        }
      }
    }

    function copyCurrentTimeLink(streamId) {
      const stream = getStreamById(streamId);
      if (!stream || !stream.url) {
        showToast('Укажите ссылку на стрим');
        return;
      }
      const secs = state.activeSeekTimes[streamId] || 0;
      const timeStr = formatSecondsToHHMMSS(secs);
      const link = buildTimestampLink(stream.url, timeStr);
      if (link) {
        navigator.clipboard.writeText(link);
        showToast(`Ссылка кадра (${timeStr}) скопирована!`);
      }
    }

    function switchPlayerFilter(filterId) {
      state.activePlayerStreamId = filterId;
      updatePlayerTab();
    }

    function copyMomentLink(url, timeStr) {
      const link = buildTimestampLink(url, timeStr);
      if (link) {
        navigator.clipboard.writeText(link);
        showToast('Ссылка с таймкодом скопирована!');
      } else {
        showToast('Укажите ссылку на стрим');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function updatePlayerTab() {
      const container = document.getElementById('allPlayersContainer');
      if (!container) return;

      // Collect main stream
      const mainStream = {
        id: 'main',
        title: state.mainTitle.trim() || 'Основной',
        url: state.videoId.trim(),
        moments: state.mainMoments,
        isMain: true
      };

      // Collect valid extra streams
      const validExtraStreams = [];
      state.extraStreams.forEach((st, idx) => {
        const url = st.streamUrl.trim();
        if (url) {
          validExtraStreams.push({
            id: st.id,
            title: st.title.trim() || `Доп. стрим ${idx + 1}`,
            url: url,
            moments: st.moments,
            isMain: false
          });
        }
      });

      const totalPlayersCount = 1 + validExtraStreams.length;

      // Filter logic
      let streamsToRender = [];
      if (state.activePlayerStreamId === 'all') {
        streamsToRender = [mainStream, ...validExtraStreams];
      } else if (state.activePlayerStreamId === 'main') {
        streamsToRender = [mainStream];
      } else {
        const sel = validExtraStreams.find(s => s.id === state.activePlayerStreamId);
        if (sel) {
          streamsToRender = [sel];
        } else {
          state.activePlayerStreamId = 'all';
          streamsToRender = [mainStream, ...validExtraStreams];
        }
      }

      // 1. Filter Tabs Header (only if validExtraStreams.length > 0)
      let tabsHeaderEl = document.getElementById('playerTabsHeader');
      if (validExtraStreams.length > 0) {
        if (!tabsHeaderEl) {
          tabsHeaderEl = document.createElement('div');
          tabsHeaderEl.id = 'playerTabsHeader';
          tabsHeaderEl.className = 'flex items-center justify-between bg-slate-900/90 border border-slate-800/90 rounded-2xl p-3 shadow-xl gap-2 flex-wrap mb-4';
          container.prepend(tabsHeaderEl);
        }

        let tabsBtnsHtml = `
          <div class="flex items-center space-x-2 text-xs font-semibold text-slate-300">
            <i data-lucide="layers" class="w-4 h-4 text-amber-400"></i>
            <span>Плееры (${totalPlayersCount}):</span>
          </div>
          <div class="flex items-center space-x-1.5 overflow-x-auto max-w-full py-0.5 custom-scrollbar">
            <button onclick="switchPlayerFilter('all')" class="px-3 py-1 rounded-xl text-xs font-semibold border transition-all cursor-pointer whitespace-nowrap ${state.activePlayerStreamId === 'all' ? 'bg-amber-500/20 text-amber-400 border-amber-500/40 shadow-sm' : 'bg-slate-950/60 text-slate-400 hover:text-slate-200 border-slate-800'}">
              Все (${totalPlayersCount})
            </button>
            <button onclick="switchPlayerFilter('main')" class="px-3 py-1 rounded-xl text-xs font-semibold border transition-all cursor-pointer whitespace-nowrap ${state.activePlayerStreamId === 'main' ? 'bg-amber-500/20 text-amber-400 border-amber-500/40 shadow-sm' : 'bg-slate-950/60 text-slate-400 hover:text-slate-200 border-slate-800'}">
              ${escapeHtml(mainStream.title)}
            </button>
        `;

        validExtraStreams.forEach(st => {
          const isActive = state.activePlayerStreamId === st.id;
          const activeStyle = isActive
            ? 'bg-purple-500/20 text-purple-300 border-purple-500/40 shadow-sm'
            : 'bg-slate-950/60 text-slate-400 hover:text-slate-200 border-slate-800';
          tabsBtnsHtml += `
            <button onclick="switchPlayerFilter('${st.id}')" class="px-3 py-1 rounded-xl text-xs font-semibold border transition-all cursor-pointer whitespace-nowrap ${activeStyle}">
              ${escapeHtml(st.title)}
            </button>
          `;
        });

        tabsBtnsHtml += `</div>`;
        if (tabsHeaderEl.innerHTML !== tabsBtnsHtml) {
          tabsHeaderEl.innerHTML = tabsBtnsHtml;
        }
      } else if (tabsHeaderEl) {
        tabsHeaderEl.remove();
      }

      // 2. Manage Player Cards
      const currentRenderedIds = new Set(streamsToRender.map(s => s.id));

      // Remove cards that are no longer active
      const existingCards = Array.from(container.querySelectorAll('.player-card-item'));
      existingCards.forEach(card => {
        const cardId = card.getAttribute('data-stream-id');
        if (!currentRenderedIds.has(cardId)) {
          card.remove();
        }
      });

      // Render or Update each card
      streamsToRender.forEach((stream) => {
        const seekSecs = state.activeSeekTimes[stream.id] !== undefined ? state.activeSeekTimes[stream.id] : null;
        const embedInfo = getEmbedInfo(stream.url, seekSecs);
        const platform = detectPlatform(stream.url);

        let cardTitle = 'Предпросмотр плеера';
        if (!stream.isMain) {
          cardTitle = `Предпросмотр плеера «${escapeHtml(stream.title)}»`;
        } else if (state.mainTitle.trim() && state.mainTitle.trim() !== 'Основной' && state.mainTitle.trim() !== 'Основной стрим') {
          cardTitle = `Предпросмотр плеера «${escapeHtml(state.mainTitle.trim())}»`;
        }

        let cardEl = document.getElementById(`player-card-${stream.id}`);
        if (!cardEl) {
          cardEl = document.createElement('div');
          cardEl.id = `player-card-${stream.id}`;
          cardEl.setAttribute('data-stream-id', stream.id);
          cardEl.className = `player-card-item bg-slate-900/90 backdrop-blur-md border ${stream.isMain ? 'border-slate-800' : 'border-purple-500/30'} rounded-2xl p-3 sm:p-5 shadow-2xl space-y-4 mb-6`;
          cardEl.innerHTML = `
            <div class="player-header-slot"></div>
            <div class="player-embed-slot"></div>
            <div class="player-controls-slot"></div>
            <div class="player-moments-slot"></div>
          `;
          container.appendChild(cardEl);
        }

        // Title & Header HTML
        let platformBadge = '';
        if (embedInfo) {
          const badgeColor = embedInfo.platform.includes('YouTube') ? 'bg-red-500/10 text-red-400 border-red-500/20' :
                             embedInfo.platform.includes('Twitch') ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' :
                             embedInfo.platform.includes('VK') ? 'bg-sky-500/10 text-sky-400 border-sky-500/20' :
                             embedInfo.platform.includes('Kick') ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                             'bg-amber-500/10 text-amber-400 border-amber-500/20';
          platformBadge = `<span class="text-[10px] font-mono font-semibold ${badgeColor} border px-2 py-0.5 rounded-md">${embedInfo.platform}</span>`;
        }

        let extraHeaderAction = '';
        if (embedInfo && embedInfo.isTwitch) {
          extraHeaderAction = `
            <a href="${escapeHtml(embedInfo.directUrl)}" target="_blank" class="inline-flex items-center space-x-1 px-2 py-0.5 bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-md text-[11px] font-semibold transition-colors cursor-pointer" title="Открыть в Twitch">
              <span>Twitch</span>
              <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          `;
        }

        const headerKey = `${cardTitle}_${embedInfo ? embedInfo.platform : ''}`;
        const headerSlot = cardEl.querySelector('.player-header-slot');
        if (headerSlot && headerSlot.getAttribute('data-header-key') !== headerKey) {
          headerSlot.setAttribute('data-header-key', headerKey);
          headerSlot.innerHTML = `
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 flex-wrap gap-2">
              <h2 class="text-sm font-semibold text-slate-200 flex items-center space-x-2 min-w-0">
                <i data-lucide="play-circle" class="w-4 h-4 ${stream.isMain ? 'text-amber-400' : 'text-purple-400'} shrink-0"></i>
                <span class="truncate">${cardTitle}</span>
              </h2>
              <div class="flex items-center space-x-2">
                ${extraHeaderAction}
                ${platformBadge}
              </div>
            </div>
          `;
        }

        // Embed Slot Update
        const embedSlot = cardEl.querySelector('.player-embed-slot');
        if (embedSlot) {
          const currentMode = embedSlot.getAttribute('data-mode');

          if (embedInfo) {
            const targetEmbedUrl = embedInfo.embedUrl;
            const existingIframe = embedSlot.querySelector('iframe');
            const currentIframeSrc = existingIframe ? existingIframe.getAttribute('src') : null;

            if (currentMode !== 'iframe' || (currentIframeSrc && !currentIframeSrc.startsWith(targetEmbedUrl.split('?')[0]))) {
              embedSlot.setAttribute('data-mode', 'iframe');
              embedSlot.removeAttribute('data-url');
              embedSlot.innerHTML = `
                <div class="aspect-video w-full rounded-2xl overflow-hidden border border-slate-800 bg-black shadow-2xl relative">
                  <iframe
                    src="${embedInfo.embedUrl}"
                    title="${cardTitle}"
                    class="w-full h-full border-0"
                    allow="${embedInfo.allow}"
                    allowfullscreen
                  ></iframe>
                </div>
              `;
            }
          } else if (stream.url) {
            const targetUrl = buildTimestampLink(stream.url, seekSecs !== null ? seekSecs + 's' : '');
            const platformName = platform === 'twitch' ? 'Twitch' : platform === 'kick' ? 'Kick' : platform === 'vk_live' ? 'VK Live' : platform === 'vk' ? 'VK Видео' : 'Видео';
            const currentUrl = embedSlot.getAttribute('data-url');

            if (currentMode !== 'fallback' || currentUrl !== targetUrl) {
              embedSlot.setAttribute('data-mode', 'fallback');
              embedSlot.setAttribute('data-url', targetUrl);
              embedSlot.innerHTML = `
                <div class="aspect-video w-full rounded-2xl border border-slate-800 bg-slate-950/80 p-5 flex flex-col items-center justify-center text-center space-y-3 shadow-inner">
                  <div class="inline-flex items-center space-x-1.5 px-3 py-1 bg-amber-500/10 border border-amber-500/20 rounded-full text-amber-400 text-xs font-semibold">
                    <i data-lucide="video" class="w-3.5 h-3.5"></i>
                    <span>${platformName} Stream</span>
                  </div>
                  <p class="text-xs text-slate-400 max-w-sm truncate font-mono">${escapeHtml(stream.url)}</p>
                  <a href="${targetUrl}" target="_blank" class="inline-flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 transition-colors shadow-lg shadow-amber-500/10 cursor-pointer">
                    <span>Открыть ${platformName} в новом окне</span>
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  </a>
                </div>
              `;
            }
          } else {

    function addMainMoment(initialTitle = '') {
      state.mainMoments.push({
        id: 'm_' + Date.now() + Math.random().toString(36).substr(2, 4),
        title: initialTitle,
        time: '',
        videoUrlOverride: '',
        subMoments: []
      });
      renderMainMoments();
    }

    function updateMainMoment(id, key, val) {
      const item = state.mainMoments.find(m => m.id === id);
      if (item) {
        item[key] = val;
        updateOutput();
      }
    }

    function deleteMainMoment(id) {
      state.mainMoments = state.mainMoments.filter(m => m.id !== id);
      renderMainMoments();
    }

    function moveMainMoment(idx, dir) {
      if (dir === 'up' && idx > 0) {
        const temp = state.mainMoments[idx];
        state.mainMoments[idx] = state.mainMoments[idx - 1];
        state.mainMoments[idx - 1] = temp;
      } else if (dir === 'down' && idx < state.mainMoments.length - 1) {
        const temp = state.mainMoments[idx];
        state.mainMoments[idx] = state.mainMoments[idx + 1];
        state.mainMoments[idx + 1] = temp;
      }
      renderMainMoments();
    }

    function addSubMoment(mainId) {
      const item = state.mainMoments.find(m => m.id === mainId);
      if (item) {
        if (!item.subMoments) item.subMoments = [];
        item.subMoments.push({ id: 'sm_' + Date.now(), title: '', time: '' });
        renderMainMoments();
      }
    }

    function updateSubMoment(mainId, subId, key, val) {
      const item = state.mainMoments.find(m => m.id === mainId);
      if (item && item.subMoments) {
        const sub = item.subMoments.find(s => s.id === subId);
        if (sub) {
          sub[key] = val;
          updateOutput();
        }
      }
    }

    function deleteSubMoment(mainId, subId) {
      const item = state.mainMoments.find(m => m.id === mainId);
      if (item && item.subMoments) {
        item.subMoments = item.subMoments.filter(s => s.id !== subId);
        renderMainMoments();
      }
    }

    }

    function addExtraSubMoment(streamId, momentId) {
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        const m = st.moments.find(item => item.id === momentId);
        if (m) {
          if (!m.subMoments) m.subMoments = [];
          m.subMoments.push({ id: 'esm_' + Date.now(), title: '', time: '' });
          renderExtraStreams();
        }
      }
    }

    function updateExtraSubMoment(streamId, momentId, subId, key, val) {
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        const m = st.moments.find(item => item.id === momentId);
        if (m && m.subMoments) {
          const sub = m.subMoments.find(s => s.id === subId);
          if (sub) {
            sub[key] = val;
            updateOutput();
          }
        }
      }
    }

    function deleteExtraSubMoment(streamId, momentId, subId) {
      const st = state.extraStreams.find(s => s.id === streamId);
      if (st) {
        const m = st.moments.find(item => item.id === momentId);
        if (m && m.subMoments) {
          m.subMoments = m.subMoments.filter(s => s.id !== subId);
          renderExtraStreams();
        }
      }
    }

    // --- Init & Event Binding ---

    document.addEventListener('DOMContentLoaded', () => {
      // Main Meta Listeners
      document.getElementById('streamDate').addEventListener('input', (e) => {
        state.streamDate = e.target.value;
        updateOutput();
      });

      document.getElementById('mainTitle').addEventListener('input', (e) => {
        state.mainTitle = e.target.value;
        updateOutput();
      });

      const videoIdEl = document.getElementById('videoId');
      const handleVideoIdChange = (e) => {
        state.videoId = e.target.value;
        if (state.activePlayerStreamId !== 'all' && state.activePlayerStreamId !== 'main') {
          state.activePlayerStreamId = 'all';
        }
        updateBadge();
        updateOutput();
      };
      videoIdEl.addEventListener('input', handleVideoIdChange);
      videoIdEl.addEventListener('change', handleVideoIdChange);

      document.getElementById('hashtags').addEventListener('input', (e) => {
        state.hashtags = e.target.value;
        updateOutput();
      });

      // Clear button
      document.getElementById('clearBtn').addEventListener('click', () => {
        state.streamDate = '';
        state.mainTitle = 'Основной';
        state.videoId = '';
        state.hashtags = '';
        state.mainMoments = [];
        state.extraStreams = [];
        state.activeSeekTime = null;

        document.getElementById('streamDate').value = '';
        document.getElementById('mainTitle').value = 'Основной';
        document.getElementById('videoId').value = '';
        document.getElementById('hashtags').value = '';

        updateBadge();
        renderMainMoments();
        renderExtraStreams();
        showToast('Форма полностью очищена');
      });

      // Copy Button
      document.getElementById('copyBtn').addEventListener('click', () => {
        const area = document.getElementById('outputArea');
        if (!area.value) return;
        navigator.clipboard.writeText(area.value);
        showToast('Текст успешно скопирован!');
      });

      // Video Playback Time Sync System
      window.addEventListener('message', (e) => {
        let data = e.data;
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch(err) { return; }
        }
        if (!data || typeof data !== 'object') return;

        // Identify source iframe
        let sourceIframe = null;
        const iframes = document.querySelectorAll('iframe');
        for (let i = 0; i < iframes.length; i++) {
          if (iframes[i].contentWindow === e.source) {
            sourceIframe = iframes[i];
            break;
          }
        }

        let targetStreamId = null;
        if (sourceIframe) {
          const card = sourceIframe.closest('.player-card-item');
          if (card) {
            targetStreamId = card.getAttribute('data-stream-id');
          }
        }

        // Parse time from YouTube or Twitch or generic payload
        let curSecs = null;
        if (data.event === 'infoDelivery' && data.info && typeof data.info.currentTime === 'number') {
          curSecs = Math.floor(data.info.currentTime);
        } else if (data.info && typeof data.info.currentTime === 'number') {
          curSecs = Math.floor(data.info.currentTime);
        } else if (data.m === 'timeupdate' && Array.isArray(data.a) && typeof data.a[0] === 'number') {
          curSecs = Math.floor(data.a[0]);
        } else if (data.type === 'player.timeupdate' && data.data && typeof data.data.currentTime === 'number') {
          curSecs = Math.floor(data.data.currentTime);
        }

        if (targetStreamId && curSecs !== null) {
          updateStreamCurrentTimeUI(targetStreamId, curSecs);
        }
      });

      // Ticker interval to request playback time from active embeds
      setInterval(() => {
        const iframes = document.querySelectorAll('.player-embed-slot iframe');
        iframes.forEach(iframe => {
          try {
            if (iframe.contentWindow) {
              iframe.contentWindow.postMessage(JSON.stringify({
                event: 'listening',
                id: 1,
                channel: 'widget'
              }), '*');
              iframe.contentWindow.postMessage(JSON.stringify({
                event: 'command',
                func: 'getCurrentTime',
                args: []
              }), '*');
            }
          } catch(err) {}
        });
      }, 400);

      // Render initial clean view
      renderMainMoments();
      renderExtraStreams();
    });
  </script>
</body>
</html>
